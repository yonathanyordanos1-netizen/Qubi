<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qubi Broadcast Control Center</title>
  <script src="https://cdn.tailwindcss@3.4.0/dist/tailwind.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --bg-card: #12121a;
      --fg: #e8e8f0;
      --muted: #6b6b80;
      --accent: #ff6b6b;
      --accent-glow: rgba(255, 107, 107, 0.4);
      --border: #2a2a3a;
      --success: #4ade80;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      margin: 0;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .header-card {
      text-align: center;
      padding: 2rem 1.5rem;
      border-radius: 16px 16px 0 0;
    }

    .header-title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .header-subtitle {
      color: var(--muted);
      font-size: 0.875rem;
    }

    .input-group {
      margin-bottom: 1rem;
    }

    .input-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--muted);
    }

    .input-group input,
    .input-group textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--fg);
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    .input-group input:focus,
    .input-group textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .input-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .secret-input .input-group input {
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .preview-card {
      background: linear-gradient(135deg, #1a1a24 0%, #0d0d14 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.875rem;
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: white;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.875rem 1.5rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
    }

    .btn:hover {
      background: #ff5252;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: var(--muted);
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      color: var(--fg);
      z-index: 1000;
      transition: transform 0.3s;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.875rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #ff5252;
    }

    .success-toast {
      border-color: var(--success);
    }

    .error-toast {
      border-color: #ff5f5f;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header Card -->
    <div class="header-card">
      <h1 class="header-title">Qubi Broadcast Control Center 🚀</h1>
      <p class="header-subtitle">Send push notifications to all app users</p>
    </div>

    <!-- Broadcast Form -->
    <div class="card" id="broadcastForm">
      <div class="input-group">
        <label for="notificationTitle">Notification Title</label>
        <input type="text" id="notificationTitle" placeholder="🎁 Exclusive Qubi Giveaway!">
      </div>

      <div class="input-group">
        <label for="notificationBody">Notification Message / Body</label>
        <textarea id="notificationBody" placeholder="Tap now to claim 250 bonus XP before midnight!"></textarea>
      </div>

      <div class="input-group secret-input">
        <label for="adminSecret">Secret Admin Key</label>
        <input type="password" id="adminSecret" placeholder="Enter admin broadcast key" />
      </div>

      <div style="margin-top: 1rem;">
        <button class="btn btn-primary" id="sendBroadcastBtn">Send Broadcast to All Users</button>
      </div>

      <p id="recipientCount" style="margin-top: 0.75rem; color: var(--muted); font-size: 0.875rem;"></p>
    </div>

    <!-- Live Preview Card -->
    <div class="card" style="border-top: 4px solid var(--accent);">
      <div class="preview-card" id="previewCard">
        📱 Preview: Notification will appear here on iOS/Android lock screens
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast" id="successToast" role="alert" aria-live="polite">
    Broadcast sent successfully! <span id="toastRecipientCount"></span> users received.
  </div>
  <div class="toast" id="errorToast" role="alert" aria-live="polite" style="display:none;"></div>

  <script>
    // Configuration - replace with your actual Supabase project ref
    const PROJECT_REF = 'qnbrrxwctokuwxglcdjd'; // auto-filled from Supabase project
    const FUNCTION_URL = `https://${PROJECT_REF}.supabase.co/functions/v1/send-broadcast`;

    const form = document.getElementById('broadcastForm');
    const sendBtn = document.getElementById('sendBroadcastBtn');
    const successToast = document.getElementById('successToast');
    const errorToast = document.getElementById('errorToast');
    const toastRecipientCount = document.getElementById('toastRecipientCount');
    const recipientCountEl = document.getElementById('recipientCount');
    const previewCard = document.getElementById('previewCard');
    const adminSecret = document.getElementById('adminSecret');
    const notificationTitle = document.getElementById('notificationTitle');
    const notificationBody = document.getElementById('notificationBody');

    // Simple template preview update
    function updatePreview() {
      previewCard.innerHTML = `
        <div style="font-size:1.2rem; font-weight:600;">${notificationTitle.value || '🎁 Exclusive Qubi Giveaway!'}</div>
        <div style="font-size:0.875rem; color:var(--muted); margin-top:0.25rem;">${notificationBody.value || 'Tap now to claim 250 bonus XP before midnight!'}</div>
      `;
    }

    [notificationTitle, notificationBody].forEach(el => {
      el.addEventListener('input', updatePreview);
    });

    sendBtn.addEventListener('click', async () => {
      const title = notificationTitle.value.trim();
      const body = notificationBody.value.trim();
      const secret = adminSecret.value.trim();

      if (!title || !body || !secret) {
        showToast('Please fill in all fields', 'error-toast');
        return;
      }

      // Show loading state
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending...';

      try {
        const response = await fetch(FUNCTION_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            title,
            body,
            secretKey: secret,
          }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Unknown error');
        }

        // Show success toast
        recipientCountEl.textContent = `${data.recipientCount} users`;
        toastRecipientCount.textContent = `${data.recipientCount} users`;
        showToast('Broadcast sent successfully!', 'success-toast');

        // Reset form
        form.reset();
        updatePreview();
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send Broadcast to All Users';
      } catch (err) {
        console.error('Broadcast error:', err);
        showToast(err.message || 'Failed to send broadcast', 'error-toast');
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send Broadcast to All Users';
      }
    });

    function showToast(message, className) {
      const toast = className.includes('error') ? errorToast : successToast;
      const hide = () => toast.classList.remove('show');
      toast.classList.remove('show');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(hide, 5000);
    }
  </script>
</body>
</html>
