name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'qubi-landing/**'
      - 'supabase/**'

jobs:
  build-ios:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Select Xcode 26.4
        run: |
          XCODE=""
          for p in /Applications/Xcode_26.4.1.app /Applications/Xcode_26.4*.app /Applications/Xcode_26*.app; do
            if [ -d "$p" ]; then XCODE="$p"; break; fi
          done
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); fi
          echo "Selected: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Run Expo Prebuild
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_OPENROUTER_API_KEY: ${{ secrets.EXPO_PUBLIC_OPENROUTER_API_KEY }}
          EXPO_PUBLIC_OPENROUTER_VISION_MODEL: ${{ secrets.EXPO_PUBLIC_OPENROUTER_VISION_MODEL }}
          EXPO_PUBLIC_NVIDIA_API_KEY: ${{ secrets.EXPO_PUBLIC_NVIDIA_API_KEY }}
        run: npx expo prebuild --platform ios

      - name: Build Xcode Archive
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_OPENROUTER_API_KEY: ${{ secrets.EXPO_PUBLIC_OPENROUTER_API_KEY }}
          EXPO_PUBLIC_OPENROUTER_VISION_MODEL: ${{ secrets.EXPO_PUBLIC_OPENROUTER_VISION_MODEL }}
          EXPO_PUBLIC_NVIDIA_API_KEY: ${{ secrets.EXPO_PUBLIC_NVIDIA_API_KEY }}
        run: |
          xcodebuild -workspace ios/Qubi.xcworkspace \
            -scheme Qubi \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -archivePath build/Qubi.xcarchive archive

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Qubi.xcarchive/Products/Applications/*.app Payload/
          zip -r Qubi.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qubi-Unsigned-IPA
          path: Qubi.ipa
