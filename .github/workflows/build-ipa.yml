name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Selected: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform ios

      - name: Build Xcode Archive
        run: |
          xcodebuild -workspace ios/Qubi.xcworkspace \
            -scheme Qubi \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -archivePath build/Qubi.xcarchive archive

      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Qubi.xcarchive/Products/Applications/*.app Payload/
          zip -r Qubi.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qubi-Unsigned-IPA
          path: Qubi.ipa
